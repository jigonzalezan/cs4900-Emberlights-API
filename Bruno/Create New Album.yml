info:
  name: Create New Album
  type: http
  seq: 13

http:
  method: POST
  url: "{{BASE_URL}}/album"
  body:
    type: json
    data: |-
      {
        "albumName": "Ten",
        "artistName": "Pearl Jam"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
