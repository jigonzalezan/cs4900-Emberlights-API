info:
  name: Get Album By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/album/{{ID}}"
  auth: inherit

runtime:
  variables:
    - name: ID
      value:
        type: number
        data: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
