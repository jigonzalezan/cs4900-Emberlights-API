info:
  name: Get Playlist By ID
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/playlist/{{PLAYLIST_ID}}"
  auth: inherit

runtime:
  variables:
    - name: PLAYLIST_ID
      value: "5"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
