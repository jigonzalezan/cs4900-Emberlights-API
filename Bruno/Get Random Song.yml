info:
  name: Get Random Song
  type: http
  seq: 16

http:
  method: GET
  url: '{{BASE_URL}}/song/random?genreName="Folk"'
  params:
    - name: genreName
      value: '"Folk"'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
