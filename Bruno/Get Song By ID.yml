info:
  name: Get Song By ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/song/{{ID}}"
  auth: inherit

runtime:
  variables:
    - name: ID
      value:
        type: number
        data: "4"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
