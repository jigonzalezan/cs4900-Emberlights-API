info:
  name: MultiRandomSongs
  type: http
  seq: 15

http:
  method: GET
  url: "{{BASE_URL}}/song/random/:num?genreName=Rock"
  params:
    - name: genreName
      value: Rock
      type: query
    - name: num
      value: "50"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
