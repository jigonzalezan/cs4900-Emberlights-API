info:
  name: Search For Album
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/album/search?albumName=paranoid"
  params:
    - name: albumName
      value: paranoid
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
