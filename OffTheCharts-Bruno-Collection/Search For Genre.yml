info:
  name: Search For Genre
  type: http
  seq: 12

http:
  method: GET
  url: "{{BASE_URL}}/genre/search?genreName=Rock"
  params:
    - name: genreName
      value: Rock
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
